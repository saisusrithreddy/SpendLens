name: Deploy Website & Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor & Generate Android Project
        run: |
          npm install
          npx cap add android

      - name: Inject Native SMS Bridge & Permissions
        run: |
          mkdir -p android/app/src/main/java/com/spendlens/app
          cp native-android/MainActivity.java android/app/src/main/java/com/spendlens/app/MainActivity.java
          cp native-android/SmsBridgePlugin.java android/app/src/main/java/com/spendlens/app/SmsBridgePlugin.java
          node -e '
            const fs = require("fs");
            const p = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(p, "utf8");
            const perms = ` <uses-permission android:name="android.permission.READ_SMS" />\n <uses-permission android:name="android.permission.RECEIVE_SMS" />`;
            if (!xml.includes("READ_SMS")) {
              xml = xml.replace(
                "<uses-permission android:name=\"android.permission.INTERNET\" />",
                "<uses-permission android:name=\"android.permission.INTERNET\" />\n" + perms
              );
              fs.writeFileSync(p, xml);
            }
          '
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../SpendLens.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SpendLens Android APK v1.0.${{ github.run_number }}
          body: "Download SpendLens.apk to install on Android and automatically track bank SMS."
          files: SpendLens.apk
